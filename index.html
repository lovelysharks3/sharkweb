            模块_课表.更新()

        function 差值计算(差值){
            差值 = Math.ceil(差值/1000/60)
            if (差值===Infinity){差值=false}
            else if (差值>60*24){差值=Math.floor(差值/60/24)+'天' +Math.ceil(差值/60)%24+'时'}
            else if (差值>60){差值=Math.floor(差值/60)+'时'+差值%60+'分'}
            else {差值=差值+'分'}
            return 差值
        }
        if(当前课程){
            if(课程开始){课程开始=`下课倒计时:${差值计算(结束差值)}  -  当前课程:${当前课程['course']}\n上课地点:${当前课程['spaceName']}`;课程进度=100-结束差值/1000/60}
            else{课程开始=`上课倒计时:${差值计算(开始差值)}  -  下节课程:${当前课程['course']}\n上课地点:${当前课程['spaceName']}`}
            document.querySelector('#课程进度提示').innerText=课程开始
        }
        else{document.querySelector('#课程进度提示').innerText = `本周没有课程了\n休息一下吧~`}
        document.querySelector('.课程进度条').style.width=课程进度 + '%'
    }
}
const 模块_文章加载 = {
    音乐(n){
        function 下一首(){
            if(音乐索引===音乐列表.length-1){音乐索引=0}
            else{音乐索引++};
            音乐.src = './music/' + 音乐列表[音乐索引];
            document.querySelector('.进度').style.width = 0
        };
        document.querySelector('#主页').insertAdjacentHTML('afterbegin',
        `<div id="音乐卡片" class="卡片 文章 竖排">
            <h1>标题加载中</h1>
            <div class="进度条"><div class="进度"></div></div>
            <div class="横排 时间条"><h3 class="当前时间">0:00</h3><h3 class="总时间">0:00</h3></div>
            <div class="音乐按钮栏 横排">
                <div class='grid左'>
                    <button class="循环按钮"><img src='./svg/循环.svg'></button>
                </div>
                <div class='grid中'>
                    <button class="左箭头"><img src='./svg/左箭头.svg'></button>
                    <button class="播放按钮"><img src='./svg/播放按钮.svg'></button>
                    <button class="右箭头"><img src='./svg/右箭头.svg'></button>
                </div>
                <div class='grid右'>
                    <div class='音量区域 横排 居中'>
                        <div class='音量条区域 横排 居中'><input class='音量条' type="range" min="0" max="100" value="20" step="10"></div>
                        <button class="音量按钮"><img src='./svg/声音开.svg'></button>
                    </div>
                </div>
            </div>
        </div>`);
        document.querySelector('.音量条').addEventListener('input',function(){
            音乐.volume =this.value *0.005
        });
        document.querySelector('.播放按钮').onclick = function(){
            if(播放中){this.querySelector('img').src='./svg/播放按钮.svg';音乐.pause()}
            else{this.querySelector('img').src='./svg/暂停按钮.svg';音乐.play()};
            播放中=!播放中
        };
        document.querySelector('.循环按钮').onclick = function(){
            if(循环播放){this.querySelector('img').src='./svg/双箭头.svg'}
            else{this.querySelector('img').src='./svg/循环.svg'};
            循环播放=!循环播放
        };
        document.querySelector('.左箭头').onclick = function(){
            if(音乐索引===0){音乐索引=音乐列表.length-1}
            else{音乐索引--};
            音乐.src = './music/' + 音乐列表[音乐索引];
            document.querySelector('.进度').style.width = 0
        };
        document.querySelector('.右箭头').onclick = 下一首
        let 长按 = false;
        document.querySelector('.进度条').addEventListener('mousedown',function(e){
            长按 = true;
            音乐.currentTime = e.offsetX / this.offsetWidth * 音乐.duration;
            e.preventDefault();
            音乐.pause();
        });
        document.addEventListener('mousemove',function(e){
            if(长按){
            const rect = document.querySelector('.进度条').getBoundingClientRect();
            let x = e.clientX - rect.left;
            x = Math.max(0, Math.min(x, rect.width));
            音乐.currentTime = (x / rect.width) * 音乐.duration;
            }
        });
        document.addEventListener('mouseup',function(){
            if(播放中&&长按){音乐.play()};
            长按 = false;
        });
        音乐.addEventListener('timeupdate',function(){
            let 百分比 = this.currentTime / this.duration *100;
            document.querySelector('.进度').style.width = 百分比 + '%';
            document.querySelector('.当前时间').textContent = 音乐时间显示(this.currentTime);
        });
        音乐.addEventListener('canplay',function(){
            document.querySelector('.总时间').textContent = 音乐时间显示(this.duration);
            document.querySelector('#音乐卡片 h1').textContent = 音乐列表[音乐索引].replace('.mp3','');
            if(播放中&&!长按){音乐.play()};
        });
        音乐.addEventListener('ended',function(){
            if(循环播放){音乐.currentTime = 0}
            else{下一首()}
        });
        document.querySelector('.进度').style.width = 0;
        if(播放中){document.querySelector('.播放按钮 img').src='./svg/暂停按钮.svg'};
        if(!循环播放){document.querySelector('.循环按钮 img').src='./svg/双箭头.svg'};
        setTimeout(function(){document.querySelector('#音乐卡片').classList.add('渐显')},80*n+10)
    },
    文本(i,id,n){
        const 文章i = document.createElement('div')
        文章i.className = '卡片 文章'
        const 标题i = document.createElement('h1')
        标题i.innerHTML = i['标题']
        const 内容i = document.createElement('h3')
        内容i.innerHTML = i['内容']
        document.querySelector('#主页').append(文章i)
        文章i.dataset.id = id
        if (i['作者']!=='shark'){
            文章i.insertAdjacentHTML("afterbegin",`<button class='删除按钮'><img src='./svg/删除按钮.svg'></button>`)
        }
        文章i.append(标题i,内容i)
        setTimeout(function(){文章i.classList.add('渐显')},80*n+10)
    },
    表格(i,id,n){
        const 文章i = document.createElement('div')
        文章i.className = '卡片 文章'
        const 标题i = document.createElement('h1')
        标题i.innerHTML = i['标题']
        const 内容i = document.createElement('table')
        if(i['id']){内容i.dataset.表格=i['id']}

        function 加载表头(行,行n){
            let tr = document.createElement('tr')
            if(i['行']){tr.innerHTML = `<th data-行='0'>${行}</th>`}
            内容i.append(tr)
        
            i['列'].forEach(function(列,列n){
                let th = document.createElement('th')
                if(行n==0){th.innerHTML = 列;th.dataset.列=0}
                else if(i['内容']){th.innerHTML = 行[列n]}
                else(th.innerHTML = ' ')
                tr.append(th)
            })
        }

        if (i['行']){i['行'].forEach(加载表头)}
        else{
            if(i['内容']&&i['列']){([i['列'],...i['内容']]).forEach(加载表头)}
        }

        document.querySelector('#主页').append(文章i)
        文章i.dataset.id = id
        if (i['作者']!=='shark'){
            文章i.insertAdjacentHTML("afterbegin",`<button class='删除按钮'><img src='./svg/删除按钮.svg'></button>`)
        }
        文章i.append(标题i,内容i)
        setTimeout(function(){文章i.classList.add('渐显')},80*n+10)
        if(i['id']==1){模块_课表.创建()}
    }
}
function 请求音乐(){
    fetch("./music/music.json")
    .then(res => res.json())
    .then(data=>{
        音乐列表=data;
        // 音乐索引=Math.floor(Math.random()*音乐列表.length);
        // 音乐.src = '/music/' + 音乐列表[音乐索引];
        document.querySelector('.总时间').textContent = 音乐时间显示(音乐.duration);
        document.querySelector('#音乐卡片 h1').textContent = 音乐列表[音乐索引].replace('.mp3','');
    })
}
function 刷新(){
    document.querySelector('#主页').replaceChildren(document.querySelector('#用户'))
    时间戳= (new Date()).getTime()
    周数指针 = Math.ceil((时间戳-开学时间.getTime())/1000/60/60/24/7)
    文章列表.forEach(function(i,n){
        if (i['类型']==='文本'){模块_文章加载.文本(i,-1,n)}
        else if (i['类型']==='音乐播放器'){模块_文章加载.音乐(n)}
        if (i['类型']==='表格'){模块_文章加载.表格(i,-1,n)}
    })
    请求音乐()
}
function 音乐时间显示(秒i){
    let 分 = Math.floor(秒i/60);
    let 秒 = Math.floor(秒i%60);
    if (秒<10){秒 = '0'+秒};
    return (分+':'+秒)
}
